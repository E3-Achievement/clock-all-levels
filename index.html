<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Time at Work</title><link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet"><style>
.rt-body{--ink:#1f1830;--purple:#5b3491;--orange:#e8731c;--odark:#a9500f;--obtn:#c2560f;--soft:#fff4e8;--bg:#f2eff6;--line:#d8cfe5;--muted:#5e5374;--good:#1f7a45;--bad:#b3261e;margin:0;background:var(--bg);color:var(--ink);font-family:'Atkinson Hyperlegible',Verdana,'Segoe UI',sans-serif;font-size:var(--fs,20px);line-height:1.45}
.rt-body #rt-app{max-width:860px;margin:0 auto;padding:16px;box-sizing:border-box}
.rt-body .rt-card{background:#fff;border:2px solid var(--line);border-radius:14px;padding:20px;margin-bottom:16px}
.rt-body h1{font-size:1.6em;margin:0 0 12px;color:var(--purple)}
.rt-body h2{font-size:1.3em;margin:0 0 8px;color:var(--purple)}
.rt-body .h3{font-size:1.1em;margin:18px 0 8px}
.rt-body h1:focus,.rt-body h2:focus,.rt-body .q:focus{outline:none}
.rt-body .center{text-align:center}
.rt-body .center .tools{justify-content:center}
.rt-body .note{margin:0 0 10px}
.rt-body .small{font-size:.85em;color:var(--muted)}
.rt-body .prog{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin:6px 0 14px;color:var(--muted)}
.rt-body .dots{display:flex;gap:6px;flex-wrap:wrap}
.rt-body .dot{width:16px;height:16px;border-radius:50%;border:2px solid var(--purple);box-sizing:border-box}
.rt-body .dot.done{background:var(--purple)}
.rt-body .dot.now{background:var(--orange);border-color:var(--odark)}
.rt-body .timer{font-family:Verdana,sans-serif;font-variant-numeric:tabular-nums}
.rt-body .btn{font:inherit;font-weight:700;min-height:52px;padding:10px 20px;border-radius:12px;border:2px solid var(--purple);background:#fff;color:var(--purple);cursor:pointer}
.rt-body .btn.main{background:var(--obtn);border-color:var(--odark);color:#fff}
.rt-body .btn:disabled{cursor:default;opacity:.8}
.rt-body .btn:focus-visible,.rt-body .say:focus-visible,.rt-body input:focus-visible{outline:4px solid var(--ink);outline-offset:2px}
.rt-body .say{font-size:1em;min-width:48px;min-height:48px;border-radius:50%;border:2px solid var(--line);background:#fff;cursor:pointer;vertical-align:middle;margin-left:4px}
.rt-body .say.sm{min-width:40px;min-height:40px;font-size:.8em;margin-left:6px}
.rt-body .tsay{white-space:nowrap}
.rt-body .chwrap{display:flex;gap:6px;align-items:center}
.rt-body .chwrap .choice{flex:1}
.rt-body .tools{display:flex;flex-wrap:wrap;gap:12px;margin-top:16px}
.rt-body .lbl{display:block;font-weight:700;margin:14px 0 6px}
.rt-body .name-in{font:inherit;font-size:1.1em;padding:12px;border:2px solid var(--line);border-radius:12px;width:100%;max-width:420px;box-sizing:border-box}
.rt-body .lvlist li{margin:4px 0}
.rt-body .task{margin-top:6px}
.rt-body .clockwrap{display:flex;justify-content:center;margin:6px 0}
.rt-body .clockwrap svg{width:min(300px,72vw);height:auto}
.rt-body .legend{text-align:center;font-weight:700;margin:4px 0 10px}
.rt-body .hand-h{color:#5b3491}
.rt-body .hand-m{color:#a9500f}
.rt-body .q{font-weight:700;font-size:1.1em;margin:14px 0 10px}
.rt-body .choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.rt-body .choice{min-height:76px;font-size:1.35em;font-family:Verdana,sans-serif;font-variant-numeric:tabular-nums}
.rt-body .choice[aria-pressed=true]{background:var(--soft);border-color:var(--obtn);box-shadow:0 0 0 3px var(--orange)}
.rt-body .choice.right{background:#e6f4ec;border-color:var(--good);color:var(--good);opacity:1}
.rt-body .shiftrow{display:flex;flex-wrap:wrap;gap:16px;justify-content:center;align-items:stretch}
.rt-body .shift,.rt-body .arrive{border:2px solid var(--line);border-radius:14px;padding:12px 16px;text-align:center;background:#fbfaff;display:flex;flex-direction:column;justify-content:center}
.rt-body .shift .lbl,.rt-body .arrive .lbl{margin:0 0 6px}
.rt-body .bigtime{font-family:Verdana,sans-serif;font-size:1.6em;font-weight:700;font-variant-numeric:tabular-nums}
.rt-body .arrive .clockwrap svg{width:min(240px,64vw)}
.rt-body .pills{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.rt-body .pill{border:2px solid var(--line);border-radius:999px;padding:4px 12px;font-weight:700;color:var(--muted)}
.rt-body .pill.on{border-color:var(--obtn);color:var(--ink);background:var(--soft)}
.rt-body .pill.done{border-color:var(--good);color:var(--good)}
.rt-body .tc{overflow-x:auto}
.rt-body .tc-title{font-weight:700;margin-bottom:6px}
.rt-body .tc table{border-collapse:collapse;width:100%;font-family:Verdana,sans-serif;font-variant-numeric:tabular-nums;font-size:.95em}
.rt-body .tc th,.rt-body .tc td{border:2px solid var(--ink);padding:10px 12px;text-align:left}
.rt-body .tc thead th{background:#ece6f5}
.rt-body .tc td.hl{background:var(--soft);animation:rtglow 1s ease-in-out infinite alternate}
@keyframes rtglow{from{box-shadow:inset 0 0 0 3px #e8731c}to{box-shadow:inset 0 0 0 7px #e8731c}}
.rt-body .answer{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-start;margin-top:6px}
.rt-body .ansrow{display:flex;gap:10px;align-items:center}
.rt-body .ans{font-family:Verdana,sans-serif;font-size:1.5em;width:4.5em;min-height:60px;text-align:center;border:3px dashed var(--obtn);border-radius:12px;background:#fff;color:var(--ink);box-sizing:border-box}
.rt-body .unit{font-weight:700;font-size:1.1em}
.rt-body .pad{display:grid;grid-template-columns:repeat(3,64px);gap:8px}
.rt-body .key{min-height:60px;min-width:64px;padding:0;font-family:Verdana,sans-serif;font-size:1.3em}
.rt-body .key.wide{grid-column:span 3}
.rt-body .fb{border-radius:12px;padding:12px 16px;margin:16px 0 0;border:2px solid;display:flex;gap:10px;align-items:center;justify-content:space-between}
.rt-body .fb.good{border-color:var(--good);background:#e6f4ec}
.rt-body .fb.bad{border-color:var(--bad);background:#fdecea}
.rt-body .fb.info{border-color:var(--orange);background:var(--soft)}
.rt-body .score{font-size:1.3em}
.rt-body .sum li{margin:4px 0}
.rt-body .report{white-space:pre-wrap;font-size:.8em;background:#f6f2fb;padding:12px;border-radius:10px;word-break:break-all}
.rt-body .sr{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}
@media (max-width:520px){.rt-body #rt-app{padding:8px}.rt-body .rt-card{padding:14px}.rt-body .choices{grid-template-columns:1fr}.rt-body .answer{flex-direction:column}}
</style></head><body class="rt-body"><main id="rt-app"></main><script>(function tawRuntime(CFG, LIB){
  'use strict';
  var app = document.getElementById('rt-app');
  var FS = {large:'20px', xl:'24px', huge:'28px'};
  document.body.style.setProperty('--fs', FS[CFG.size] || '20px');
  function h(tag, props){
    var el = document.createElement(tag);
    if (props) for (var k in props){
      var v = props[k];
      if (v == null || v === false) continue;
      if (k === 'class') el.className = v;
      else if (k === 'svg') el.innerHTML = v;
      else if (k === 'value') el.value = v;
      else if (k.slice(0, 2) === 'on' && typeof v === 'function') el.addEventListener(k.slice(2).toLowerCase(), v);
      else el.setAttribute(k, v === true ? '' : v);
    }
    add(el, Array.prototype.slice.call(arguments, 2));
    return el;
  }
  function add(el, kids){ kids.forEach(function(c){ if (c == null || c === false) return; if (Array.isArray(c)) add(el, c); else el.appendChild(typeof c === 'object' ? c : document.createTextNode(String(c))); }); }

  var F = CFG.look !== 'adult';
  var EMOJI_RE = /[\u{1F000}-\u{1FAFF}\u{2600}-\u{27BF}\u{2B00}-\u{2BFF}\u{FE0F}\u{200D}]/gu;
  function words(t){
    t = String(t).replace(EMOJI_RE, '');
    t = t.replace(/\b12:00 PM\b/g, '12 noon').replace(/\b12:00 AM\b/g, '12 midnight');
    t = t.replace(/\b(\d{1,2}):00\b/g, "$1 o'clock").replace(/\b(\d{1,2}):0(\d)\b/g, '$1 oh $2').replace(/\b(\d{1,2}):(\d\d)\b/g, '$1 $2');
    t = t.replace(/\bAM\b/g, 'A.M.').replace(/\bPM\b/g, 'P.M.');
    t = t.replace(/\b(\d+)\.5\b/g, '$1 and a half');
    t = t.replace(/[+=×÷✓✗➜_*#|]/g, function(c){ return {'+':' plus ', '=':' equals ', '×':' times ', '÷':' divided by '}[c] || ' '; });
    return t;
  }
  function say(t){
    if (CFG.read === 'off' || !('speechSynthesis' in window)) return;
    try { speechSynthesis.cancel(); var u = new SpeechSynthesisUtterance(words(t)); u.rate = Number(CFG.rate) || 0.85; speechSynthesis.speak(u); } catch(e){}
  }
  var live = h('div', {class:'sr', 'aria-live':'polite'}); document.body.appendChild(live);
  function tell(t){ live.textContent = ''; setTimeout(function(){ live.textContent = String(t).replace(EMOJI_RE, ''); }, 40); if (CFG.read === 'auto') say(t); }
  function sayBtn(t, what){ if (CFG.read === 'off') return null; return h('button', {type:'button', class:'say', 'aria-label':'Read ' + (what || 'this') + ' out loud', onclick:function(){ say(typeof t === 'function' ? t() : t); }}, '🔊'); }

  var META = LIB.META, face = LIB.face, ampm = LIB.ampm;
  var ORDER = ['c1', 'c2', 'c3', 't1', 't2', 't3'].filter(function(k){ return CFG.levels && CFG.levels[k]; });
  if (!ORDER.length) ORDER = ['c1'];
  var R = LIB.rng((Date.now() ^ Math.floor(Math.random() * 1e9)) >>> 0);
  var S = {name:''};
  function fresh(){
    var name = S.name || '';
    S = {screen:'start', name:name, li:0, lv:{}, t0:0, focusH:true, msg:''};
    ORDER.forEach(function(k){ S.lv[k] = {items:LIB.gen(k, R, CFG), i:0, misses:0, hints:0, shown:0, rec:[]}; });
  }
  function newItem(){ S.cur = {sel:null, step:1, inp:'', tries:0, hints:0, sh:0, done:false, shown:false, fb:null, glow:false}; }
  function K(){ return ORDER[S.li]; }
  function LV(){ return S.lv[K()]; }
  function IT(){ var L = LV(); return L.items[L.i]; }
  function dir(k){ return LIB.dirOf(k, CFG, false); }
  function levelTitle(i){ return (ORDER.length > 1 ? 'Level ' + (i + 1) + ' of ' + ORDER.length + ': ' : '') + META[ORDER[i]].title; }
  function usesBox(k, c){ return k === 't2' || k === 't3' || (k === 'c3' && c.step === 2); }

  function render(){
    var ae = document.activeElement, key = ae && ae.getAttribute && ae.getAttribute('data-k');
    app.textContent = '';
    app.appendChild(view());
    var target = null;
    if (S.focusH){ target = app.querySelector('h1, h2'); if (target) target.setAttribute('tabindex', '-1'); S.focusH = false; }
    else if (S.focusK){ target = app.querySelector('[data-k="' + S.focusK + '"]'); S.focusK = null; }
    else if (key){ target = app.querySelector('[data-k="' + key + '"]'); }
    if (target) target.focus();
  }
  function view(){
    if (S.screen === 'start') return startView();
    if (S.screen === 'between') return betweenView();
    if (S.screen === 'finish') return finishView();
    return levelView();
  }

  /* ---- Start ---- */
  function startView(){
    return h('div', {class:'rt-card'},
      h('h1', null, CFG.title, F ? ' ⏰' : ''),
      CFG.directions ? h('p', {class:'note'}, CFG.directions, ' ', sayBtn(CFG.directions, 'the directions')) : null,
      h('p', null, h('b', null, 'In this activity:')),
      h('ol', {class:'lvlist'}, ORDER.map(function(k, i){ return h('li', null, (ORDER.length > 1 ? 'Level ' + (i + 1) + ': ' : '') + META[k].title); })),
      h('label', {for:'rt-name', class:'lbl'}, 'Your name'),
      h('input', {id:'rt-name', 'data-k':'name', type:'text', autocomplete:'off', class:'name-in', value:S.name, oninput:function(e){ S.name = e.target.value; }, onkeydown:function(e){ if (e.key === 'Enter') begin(); }}),
      S.msg ? h('div', {class:'fb info', role:'status'}, S.msg) : null,
      h('div', {class:'tools'}, h('button', {type:'button', class:'btn main', 'data-k':'start', onclick:begin}, 'Start', F ? ' ▶️' : ''))
    );
  }
  function begin(){
    S.name = (S.name || '').trim();
    if (!S.name){ S.msg = 'Type your name first.'; S.focusK = 'name'; render(); tell(S.msg); return; }
    S.msg = ''; S.t0 = Date.now(); goLevel(0);
  }
  function goLevel(i){ S.li = i; S.screen = 'level'; newItem(); S.focusH = true; render(); tell(levelTitle(i) + '. ' + dir(ORDER[i])); }

  /* ---- Pieces ---- */
  function smallSay(t, what){ if (CFG.read === 'off') return null; return h('button', {type:'button', class:'say sm', 'aria-label':'Read ' + (what || t) + ' out loud', onpointerdown:function(e){ e.preventDefault(); }, onclick:function(){ say(typeof t === 'function' ? t() : t); }}, '🔊'); }
  function timeSay(txt, spoken){ return h('span', {class:'tsay'}, txt, smallSay(spoken || txt, spoken || txt)); }
  function choiceRow(list, c, okIdx){
    return h('div', {class:'choices', role:'group', 'aria-label':'Answer choices'}, list.map(function(lab, j){
      var right = c.done && j === okIdx;
      return h('div', {class:'chwrap'},
        h('button', {type:'button', class:'btn choice' + (right ? ' right' : ''), 'data-k':'ch' + j + '-' + c.step, 'aria-pressed':String(c.sel === j), disabled:c.done ? true : null,
          onclick:function(){ c.sel = j; render(); if (CFG.read !== 'off') say(lab); }}, (right ? '✓ ' : '') + lab),
        smallSay(right ? 'The answer is ' + lab : lab, 'choice ' + lab));
    }));
  }
  function numPad(c, allowDot){
    function press(kk){
      if (kk === '⌫') c.inp = c.inp.slice(0, -1);
      else if (kk === 'C') c.inp = '';
      else if (kk === '.'){ if (c.inp.indexOf('.') < 0) c.inp += (c.inp ? '.' : '0.'); }
      else if (c.inp.length < 5) c.inp += kk;
      var box = app.querySelector('.ans'); if (box) box.value = c.inp;
    }
    function keyBtn(kk, label, cls){ return h('button', {type:'button', class:'btn key' + (cls ? ' ' + cls : ''), 'aria-label':label, onpointerdown:function(e){ e.preventDefault(); }, onclick:function(){ press(kk); }}, kk); }
    var keys = ['1', '2', '3', '4', '5', '6', '7', '8', '9'].map(function(kk){ return keyBtn(kk, kk); });
    keys.push(allowDot ? keyBtn('.', 'Point') : h('span'));
    keys.push(keyBtn('0', '0'), keyBtn('⌫', 'Delete'), keyBtn('C', 'Clear', 'wide'));
    return h('div', {class:'pad', role:'group', 'aria-label':'Number pad'}, keys);
  }
  function answerBox(c, unit, label, allowDot, tool){
    var inp = h('input', {class:'ans', 'data-k':'ans', type:'text', inputmode:allowDot ? 'decimal' : 'numeric', autocomplete:'off', 'aria-label':label, value:c.inp, readonly:c.done ? true : null,
      oninput:function(e){ var v = e.target.value.replace(allowDot ? /[^0-9.]/g : /[^0-9]/g, ''); c.inp = v; if (e.target.value !== v) e.target.value = v; },
      onkeydown:function(e){ if (e.key === 'Enter'){ e.preventDefault(); check(); } }});
    return h('div', {class:'answer'}, h('div', {class:'ansrow'}, inp, h('span', {class:'unit'}, unit), smallSay(function(){ return c.inp ? (c.done ? 'The answer is ' : 'Your answer is ') + c.inp + ' ' + unit + '.' : 'The box is empty. Type your answer.'; }, 'your answer')), (tool === 'pad' && !c.done) ? numPad(c, allowDot) : null);
  }
  function legend(){ return CFG.colors ? h('p', {class:'legend'}, h('span', {class:'hand-h'}, 'Short hand = hour'), '  ·  ', h('span', {class:'hand-m'}, 'Long hand = minutes')) : null; }
  function clockBox(m){ return h('div', {class:'clockwrap', svg:LIB.clockSVG(m, {colors:CFG.colors})}); }
  function shiftRow(it){
    return h('div', {class:'shiftrow'},
      h('div', {class:'shift'}, h('span', {class:'lbl'}, 'Your shift starts at'), h('div', {class:'bigtime'}, timeSay(ampm(it.start), 'Your shift starts at ' + ampm(it.start)))),
      h('div', {class:'arrive'}, h('span', {class:'lbl'}, 'You got to work at'), clockBox(it.arrive), CFG.c2digital ? h('div', {class:'bigtime'}, timeSay(face(it.arrive), 'You got to work at ' + face(it.arrive))) : null));
  }
  function cardTable(rows, opt){
    opt = opt || {};
    function cell(j, col, txt, day){ return h('td', {class:opt.hl && opt.hl[0] === j && opt.hl[1] === col ? 'hl' : null}, timeSay(txt, day + ' ' + (col === 'in' ? 'in' : 'out') + ': ' + txt)); }
    return h('div', {class:'tc'}, h('div', {class:'tc-title'}, (F ? '🕒 ' : '') + 'Timecard'),
      h('table', null,
        h('thead', null, h('tr', null, h('th', {scope:'col'}, 'Day'), h('th', {scope:'col'}, 'In'), h('th', {scope:'col'}, 'Out'), opt.hours ? h('th', {scope:'col'}, 'Hours') : null)),
        h('tbody', null, rows.map(function(r, j){ return h('tr', null, h('th', {scope:'row'}, r.day), cell(j, 'in', ampm(r.inM), r.day), cell(j, 'out', ampm(r.outM), r.day), opt.hours ? h('td', null, timeSay(LIB.hrsText(r.hrs), r.day + ': ' + LIB.hrsText(r.hrs) + ' hours')) : null); }))));
  }
  function okIdx(it){ for (var j = 0; j < it.choices.length; j++) if (it.choices[j].type === 'ok') return j; return -1; }
  function qSpeak(text, choices){ return h('p', {class:'q'}, text, ' ', sayBtn(text + (choices ? ' Is it ' + choices.slice(0, -1).join(', ') + ', or ' + choices[choices.length - 1] + '?' : ''), 'the question')); }

  var TASKS = {
    c1:function(it, c){
      return h('div', {class:'task'}, clockBox(it.m), legend(), qSpeak('What time does the clock show?', it.choices.map(function(ch){ return face(ch.m); })),
        choiceRow(it.choices.map(function(ch){ return face(ch.m); }), c, okIdx(it)));
    },
    c2:function(it, c){
      var q = 'Were you early, on time, or late?';
      return h('div', {class:'task'}, shiftRow(it), legend(),
        h('p', {class:'q'}, q, ' ', sayBtn('Your shift starts at ' + ampm(it.start) + '. ' + (CFG.c2digital ? 'You got there at ' + face(it.arrive) + '. ' : '') + q, 'the question')),
        choiceRow(['Early', 'On time', 'Late'], c, ['early', 'ontime', 'late'].indexOf(it.kind)));
    },
    c3:function(it, c){
      var pills = h('div', {class:'pills'}, h('span', {class:'pill ' + (c.step === 1 ? 'on' : 'done')}, (c.step > 1 ? '✓ ' : '') + '1. Early or late?'), h('span', {class:'pill' + (c.step === 2 ? ' on' : '')}, '2. How many minutes?'));
      var body = [pills, shiftRow(it), legend()];
      if (c.step === 1){
        body.push(h('p', {class:'q'}, 'Were you early or late? ', sayBtn('Your shift starts at ' + ampm(it.start) + '. ' + (CFG.c2digital ? 'You got there at ' + face(it.arrive) + '. ' : '') + 'Were you early or late?', 'the question')));
        body.push(choiceRow(['Early', 'Late'], c, it.kind === 'early' ? 0 : 1));
      } else {
        var w = it.kind === 'early' ? 'early' : 'late';
        body.push(qSpeak('You were ' + w + '. How many minutes ' + w + '?'));
        body.push(answerBox(c, 'minutes', 'Minutes ' + w, false, CFG.c3tool));
      }
      return h('div', {class:'task'}, body);
    },
    t1:function(it, c){
      var day = it.card[it.day].day, q = 'What time did you clock ' + (it.which === 'in' ? 'IN' : 'OUT') + ' on ' + day + '?';
      return h('div', {class:'task'}, cardTable(it.card, {hl:(c.glow || c.done) ? [it.day, it.which] : null}),
        h('p', {class:'q'}, q, ' ', sayBtn(function(){ var ch = it.choices.map(function(x){ return ampm(x.m); }); return q.replace(' IN ', ' in ').replace(' OUT ', ' out ') + ' Is it ' + ch.slice(0, -1).join(', ') + ', or ' + ch[ch.length - 1] + '?'; }, 'the question')),
        choiceRow(it.choices.map(function(ch){ return ampm(ch.m); }), c, okIdx(it)));
    },
    t2:function(it, c){
      var q = 'You clocked in at ' + ampm(it.inM) + '. You clocked out at ' + ampm(it.outM) + '. How many hours did you work?';
      return h('div', {class:'task'},
        h('div', {class:'tc'}, h('table', null, h('thead', null, h('tr', null, h('th', {scope:'col'}, 'In'), h('th', {scope:'col'}, 'Out'))), h('tbody', null, h('tr', null, h('td', null, timeSay(ampm(it.inM), 'In at ' + ampm(it.inM))), h('td', null, timeSay(ampm(it.outM), 'Out at ' + ampm(it.outM))))))),
        h('p', {class:'q'}, 'How many hours did you work? ', sayBtn(q, 'the question')),
        answerBox(c, 'hours', 'Hours worked', !!CFG.t2half, CFG.t2tool));
    },
    t3:function(it, c){
      var q = 'How many hours did you work this week?';
      return h('div', {class:'task'}, cardTable(it.rows, {hours:CFG.t3show}), qSpeak(q),
        answerBox(c, 'hours in all', 'Total hours', !!CFG.t3half, CFG.t3tool));
    }
  };

  /* ---- Checking ---- */
  function num(s){ if (!s || s === '.') return null; var v = parseFloat(s); return isNaN(v) ? null : v; }
  function near(a, b){ return Math.abs(a - b) < 0.001; }
  var CHECK = {
    c1:function(it, c){
      if (c.sel == null) return {empty:'Tap a time first. Then tap Check.'};
